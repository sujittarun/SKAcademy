<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Book a net · Super Kings Academy</title>
<meta name="description" content="Book an astro or matting practice net by the hour, or enquire about the main ground, at Super Kings Academy, VAKAMAN FE, Coimbatore. Live availability." />
<script>
  /* blocking: applies the persisted theme before first paint, else the
     page renders dark and flashes. Raw string, not JSON. */
  try { document.documentElement.dataset.theme = localStorage.getItem("ska-theme") || "dark"; } catch (e) {}
  document.documentElement.className += " lt-js";
</script>
<link rel="stylesheet" href="assets/css/glass.css?v=22" />
<style>
  /* Page-local LAYOUT only. Glass, buttons, fields, pills, .slot,
     .form-msg and .lt-empty all come from glass.css. */
  .bk-wrap { max-width: 720px; margin: 0 auto; width: 100%; }

  .bk-head { text-align: center; }
  .bk-head h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; }
  .bk-head p { color: var(--ink-mid); margin-top: 6px; font-size: 14px; }

  /* One step per decision, revealed by dropping [hidden]. The !important
     is load-bearing: glass.css gives .pill display:inline-flex, and a
     class rule beats the browser's own [hidden]{display:none} — so the
     hour counter renders as a permanent empty gold pill without this. */
  [hidden] { display: none !important; }
  .steps { display: flex; flex-direction: column; gap: var(--gap-3); }
  .step:not([hidden]) { animation: lt-step-in .4s var(--ease-spring) both; }
  @media (prefers-reduced-motion: reduce) { .step:not([hidden]) { animation: none; } }

  .step-h { display: flex; align-items: center; gap: 10px; margin-bottom: var(--gap-3); }
  .step-h .n {
    width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; color: #231d00; background: var(--gold-grad);
  }
  .step-h h2 { font-size: 17px; font-weight: 700; }

  .fac-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .fac-pick { grid-template-columns: 1fr; } }
  .fac-card {
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    min-height: 56px; padding: 14px 16px; text-align: left; font: inherit; cursor: pointer;
    color: var(--ink-hi); background: var(--tile-bg);
    border: 1px solid var(--tile-border); border-radius: var(--r-md);
    transition: border-color .2s ease, background .2s ease;
  }
  .fac-card:hover { border-color: var(--input-border-hover); }
  .fac-card .fc-name { font-weight: 800; font-size: 15px; }
  .fac-card .fc-sub { font-size: 12px; color: var(--ink-mid); }
  /* The rate keeps its row whether or not a figure arrived, so the card
     does not jump when the server answers — and stays EMPTY when it does
     not, because a guessed price is the one thing worse than no price. */
  .fac-card .fc-rate {
    min-height: 17px; margin-top: 2px;
    font-size: 13px; font-weight: 750; color: var(--tx-gold);
    font-variant-numeric: tabular-nums;
  }
  .fac-card.active { border-color: var(--gold-400); background: rgba(247, 203, 21, .1); }
  .fac-card.active .fc-name { color: var(--tx-gold); }

  /* ---------- The day strip ----------
     A native <input type="date"> renders as an OS control that matches
     nothing else on the page, and on Android it is a modal calendar for a
     decision that is nearly always "today or the next few days". This is
     the pattern every Indian booking app uses instead. The native input
     is still here, one tap away, because request_booking accepts +90 days
     and fourteen chips cannot reach that. */
  .day-strip {
    position: relative;              /* offsetParent for the centring maths */
    display: flex; gap: 8px;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;      /* momentum on iOS */
    overscroll-behavior-x: contain;         /* no page-back gesture on the strip */
    scroll-snap-type: x mandatory;
    scroll-padding-left: 2px;
    padding: 2px 2px 10px;
    scrollbar-width: thin;
  }
  .day-strip::-webkit-scrollbar { height: 6px; }
  .day-strip::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: var(--r-pill); }
  .day-strip::-webkit-scrollbar-track { background: transparent; }

  .day-chip {
    scroll-snap-align: start;
    flex: 0 0 auto; min-width: 64px; min-height: 68px;   /* ≥44px tap target */
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 9px 10px; border-radius: var(--r-sm);
    border: 1px solid var(--tile-border); background: var(--tile-bg);
    color: var(--ink-mid); font: inherit; cursor: pointer;
    transition: border-color .2s ease, background .2s ease, transform .2s var(--ease-spring);
  }
  .day-chip:hover { border-color: var(--input-border-hover); color: var(--ink-hi); }
  .day-chip:active { transform: scale(.96); }

  /* ---------- a day that is already sold ----------
     Three signals, because one is never enough:
       · the number is struck through — the shape reads as "not this one"
         before any colour is processed, and it survives colour blindness
         and a phone in bright sun;
       · the chip recedes (dimmer, flatter, dashed edge) so the free days
         are what the eye lands on;
       · a red dot, for the reader who is scanning for a status.
     The aria-label carries "already booked" too, so it is not a purely
     visual fact.

     Still clickable: tapping shows the sentence telling them what to do,
     which a disabled chip cannot. */
  .day-chip.sold { border-style: dashed; opacity: .62; }
  .day-chip.sold .dc-num { text-decoration: line-through;
                           text-decoration-thickness: 2px;
                           text-decoration-color: var(--tx-red); }
  .day-chip.sold::after {
    content: ""; position: absolute; top: 7px; right: 7px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--tx-red);
  }
  .day-chip { position: relative; }
  /* Selected AND sold: keep the selection obvious, keep the strike. The
     chosen day must never look free just because it is chosen. */
  .day-chip.sold.on { opacity: 1; border-style: solid; }
  .day-chip .dc-top { font-size: 11px; font-weight: 700; white-space: nowrap; line-height: 1.2; }
  .day-chip .dc-top.wd { font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; }
  .day-chip .dc-num {
    font-size: 19px; font-weight: 800; line-height: 1.15; color: var(--ink-hi);
    font-variant-numeric: tabular-nums;
  }
  /* A block with a min-height holds its row even when the month is blank,
     so only the chips where the month CHANGES print one and every chip is
     still the same height. */
  .day-chip .dc-mon { display: block; min-height: 13px; line-height: 13px; font-size: 10.5px; color: var(--ink-low); }
  .day-chip.on {
    border-color: transparent; background: var(--gold-grad); color: #231d00;
    box-shadow: 0 8px 20px rgba(242, 194, 32, .28);
  }
  .day-chip.on .dc-num, .day-chip.on .dc-mon { color: #231d00; }
  .day-chip:focus-visible { outline: 2px solid var(--tx-optic); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .day-chip { transition: none; } }

  .day-sel { margin-top: 2px; font-size: 12.5px; color: var(--ink-mid); }
  #bkDate { max-width: 240px; }
  #refreshBtn { min-height: 44px; }

  /* slot sub-labels. .slot itself is a design-system component. */
  .sl-full { color: var(--tx-red); font-weight: 700; }
  .sl-left { color: var(--tx-optic); font-weight: 700; }

  /* anything replacing or following the hour tiles spans the whole grid */
  .slot-grid .lt-empty, .grid-dead { grid-column: 1 / -1; }
  .grid-dead {
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    text-align: center; padding: 4px 0 2px; font-size: 13px; color: var(--ink-low);
  }

  .bk-form { display: flex; flex-direction: column; gap: var(--gap-3); }

  .done-card { text-align: center; padding: clamp(30px, 6vh, 52px) var(--gap-4); display: none; }
  .done-card.show { display: block; animation: lt-step-in .5s var(--ease-spring) both; }
  .done-card .big-check {
    width: 66px; height: 66px; margin: 0 auto var(--gap-3); border-radius: 50%;
    display: grid; place-items: center; background: rgba(52, 211, 153, .15);
    border: 1.5px solid rgba(52, 211, 153, .5); color: var(--tx-green);
  }
  .done-card .big-check svg { width: 30px; height: 30px; }
  .done-lines { display: flex; flex-direction: column; gap: 6px; max-width: 320px; margin: var(--gap-3) auto 0; }
  .done-lines .dl {
    display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px;
    border-radius: var(--r-sm); border: 1px solid var(--tile-border); background: var(--tile-bg);
    font-size: 13px; color: var(--ink-mid);
  }
  .done-lines .dl b { color: var(--ink-hi); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- The quote, shown before the Book button ----------
     Sits directly above the action it prices, so the figure and the
     commitment are read in one glance rather than one screen apart. */
  .quote {
    margin: var(--gap-3) 0 var(--gap-2);
    padding: 13px 15px;
    border-radius: var(--r-md);
    border: 1px solid var(--tile-border);
    background: var(--tile-bg);
  }
  .q-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .q-lab { font-size: 13px; color: var(--ink-mid); }
  .q-amt {
    font-size: 24px; font-weight: 800; color: var(--ink-hi);
    /* tabular so the figure does not jump sideways as it re-quotes */
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .q-note { margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: var(--ink-low); }
  @media (max-width: 420px) { .q-amt { font-size: 21px; } }

  /* ---------- Pay by UPI, on the success card ----------
     Below the confirmation line, never above it: the academy still has to
     confirm the slot, and that has to be the first thing read. */
  .pay {
    margin: var(--gap-4) auto 0; max-width: 340px; text-align: center;
    padding: var(--gap-3); border-radius: var(--r-md);
    border: 1px solid var(--tile-border); background: var(--tile-bg);
  }
  .pay-lab { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-low); }
  .pay-amt {
    font-size: 28px; font-weight: 800; color: var(--ink-hi);
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin: 2px 0 var(--gap-3);
  }
  .pay-vpa { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: var(--gap-2); }
  .pay-vpa code {
    user-select: all; -webkit-user-select: all;
    display: inline-flex; align-items: center; min-height: 34px; padding: 7px 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    border-radius: var(--r-sm); border: 1px dashed var(--tile-border);
    background: var(--input-bg); color: var(--ink-hi); word-break: break-all;
  }
  #payCopy { min-height: 38px; }
  .pay-note { margin-top: var(--gap-2); font-size: 11.5px; line-height: 1.5; color: var(--ink-low); }
</style>
</head>
<body>
  <div class="lt-bg" aria-hidden="true"></div>

  <!-- PUBLIC page: no LT.managerShell(). The staff tabs, the sign-out
       button and the sample-data banner do not belong in front of a
       customer. public_slots, public_quote, request_booking and
       submit_application are genuinely anon-executable, so this page
       works in DEV exactly as it will at go-live. -->
  <nav class="lt-nav glass">
    <a class="nav-brand" href="index.html">
      <span class="mark" data-logo="40"></span>
      <span class="t"><strong>Super Kings Academy</strong><span>VAKAMAN FE</span></span>
    </a>
    <div class="nav-actions">
      <button type="button" class="theme-toggle"></button>
      <a class="btn btn-ghost btn-sm hide-mobile" href="admission.html">Join coaching</a>
      <a class="btn btn-glass btn-sm" href="index.html">← Back to site</a>
    </div>
  </nav>

  <main class="lt-main lt-page">
    <div class="bk-wrap">
      <div class="bk-head" id="bkHead">
        <h1>Book at VAKAMAN FE</h1>
        <p>Nothing is paid online.</p>
      </div>

      <div class="steps mt-4" id="bkSteps">
        <!-- 1 · what -->
        <section class="glass glass-card tight step" id="step1">
          <div class="step-h"><span class="n">1</span><h2>What are you booking?</h2></div>
          <div class="fac-pick" id="facPick" role="group" aria-label="Choose a facility">
            <button type="button" class="fac-card" data-f="nets" aria-pressed="false">
              <span class="fc-name">Practice Nets</span>
              <span class="fc-sub">4 nets · Astro &amp; Matting</span>
            </button>
            <button type="button" class="fac-card" data-f="ground" aria-pressed="false">
              <span class="fc-name">Main Ground</span>
              <span class="fc-sub">Full day</span>
            </button>
          </div>
        </section>

        <!-- 2 · when -->
        <section class="glass glass-card tight step" id="step2" hidden>
          <div class="step-h">
            <span class="n">2</span><h2>Which day?</h2>
            <span class="grow"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="otherDateBtn"
                    aria-expanded="false" aria-controls="otherDateWrap">Other date</button>
          </div>
          <div class="day-strip" id="dayStrip" role="radiogroup" aria-label="Choose a day"></div>
          <div class="day-sel" id="daySel"></div>
          <div class="mt-3" id="otherDateWrap" hidden>
            <label class="field" style="max-width:240px">
              <span>Any date up to 90 days ahead</span>
              <input type="date" id="bkDate" />
            </label>
          </div>
          <div class="mt-3" id="groundState" hidden></div>
        </section>

        <!-- 3 · surface (nets only) -->
        <section class="glass glass-card tight step" id="step3" hidden>
          <div class="step-h"><span class="n">3</span><h2>Which surface?</h2></div>
          <!-- Astro and Matting are SEPARATE facilities in the database as of
               2026-08-18c, because they are priced apart. The two figures
               below are read from public_quote() for the chosen day; this
               page holds neither of them. -->
          <div class="fac-pick" id="surfPick" role="group" aria-label="Choose a surface">
            <button type="button" class="fac-card" data-s="astro" aria-pressed="false">
              <span class="fc-name">Astro nets</span>
              <span class="fc-sub" data-count="astro"></span>
              <span class="fc-rate" data-rate="astro"></span>
            </button>
            <button type="button" class="fac-card" data-s="matting" aria-pressed="false">
              <span class="fc-name">Matting nets</span>
              <span class="fc-sub" data-count="matting"></span>
              <span class="fc-rate" data-rate="matting"></span>
            </button>
          </div>
        </section>

        <!-- 4 · hours (nets only — the ground is never hourly) -->
        <section class="glass glass-card tight step" id="step4" hidden>
          <div class="step-h">
            <span class="n">4</span><h2>Which hours?</h2>
            <span class="grow"></span>
            <span class="pill gold" id="selCount" hidden></span>
            <button type="button" class="btn btn-ghost btn-sm" id="refreshBtn" aria-label="Check availability again">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
            </button>
          </div>
          <div class="slot-grid" id="slotGrid"></div>
        </section>

        <!-- 5 · who, and send -->
        <section class="glass glass-card tight step" id="step5" hidden>
          <!-- the number is set in script: the ground has no surface and no
               hours step, so this is its step 3, not a 5 with gaps above it -->
          <div class="step-h"><span class="n" id="detailsNum">5</span><h2>Your details</h2></div>
          <form class="bk-form" id="bkForm" novalidate>
            <!-- NEVER prefill anything here. This repo is public and served
                 as a static site, so a value= attribute is published the
                 moment it is committed and stays in git history after it is
                 removed. These are also a customer's name and number, so
                 the page does not remember them between visits either. -->
            <label class="field">
              <span>Your name</span>
              <input type="text" id="bkName" name="name" autocomplete="name" autocapitalize="words" required />
            </label>
            <label class="field">
              <span>Mobile number</span>
              <input type="tel" id="bkPhone" name="phone" autocomplete="tel" inputmode="numeric"
                     data-digits="10" placeholder="10-digit mobile" required />
            </label>
            <!-- What it costs, BEFORE committing. Filled by public_quote(),
                 which works the figure out in Postgres — this page never
                 multiplies hours by a rate and never holds one. -->
            <div class="quote" id="bkQuote" aria-live="polite" hidden>
              <div class="q-row">
                <span class="q-lab" id="bkQuoteLab">Total</span>
                <span class="q-amt" id="bkQuoteAmt">—</span>
              </div>
              <div class="q-note" id="bkQuoteNote"></div>
            </div>
            <div class="form-msg" id="bkMsg" role="status" aria-live="polite" style="min-height:0;"></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="bkSubmit" disabled>Book</button>
          </form>
        </section>
      </div>

      <!-- success -->
      <div class="glass done-card" id="doneCard">
        <div class="big-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2 id="doneTitle">Request received</h2>
        <p class="muted mt-2" id="doneDetail"></p>
        <div class="done-lines" id="doneLines"></div>
        <p class="faint mt-3" id="doneHonest" style="font-size:13px;line-height:1.55;"></p>

        <!-- Optional payment, revealed only when the SERVER supplies both a
             collection handle and a figure. There is no fallback UPI id in
             this file, by design — see loadPayment(). -->
        <div class="pay" id="payBlock" hidden>
          <div class="pay-lab">Amount due</div>
          <div class="pay-amt" id="payAmt">—</div>
          <a class="btn btn-primary btn-block btn-lg" id="payBtn" href="#" rel="noopener">Pay by UPI</a>
          <div class="pay-vpa">
            <code id="payVpa"></code>
            <button type="button" class="btn btn-glass btn-sm" id="payCopy">Copy</button>
          </div>
          <p class="pay-note" id="payNote"></p>
        </div>

        <div class="mt-4 flex" style="justify-content:center; flex-wrap:wrap;">
          <button type="button" class="btn btn-primary" id="againBtn">Book again</button>
          <a class="btn btn-glass" href="index.html">Back to home</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/core.js?v=22"></script>
  <script src="assets/js/cloud.js?v=22"></script>
  <!-- dev-data.js loads for shell consistency and is DELIBERATELY NOT USED
       here. Sample rows behind the striped banner are a preview on a staff
       screen; on a public page they would be a customer shown invented
       availability with no way to tell. A failed read says "could not
       load" instead — an empty academy and a broken one must not look
       alike. -->
  <script src="assets/js/dev-data.js?v=22"></script>
  <script>
    /* page script last. core.js MUST NOT be in <head> — its ink-filter
       IIFE returns early if document.body is missing and never retries. */
    (function () {
      "use strict";

      /* WHAT AN ANONYMOUS VISITOR MAY ACTUALLY DO
         · availability → public_slots (no name, phone or amount in the view)
         · a price      → public_quote(), which computes in Postgres. This
                          page holds NO rate and does NO arithmetic on one.
         · the nets     → request_booking(), which writes a PENDING row with
                          no court for staff to confirm
         · the ground   → NOT request_booking. It raises 'invalid hour'
                          outside 6..22 and a full day is hour 0. So the
                          ground is an ENQUIRY via submit_application() and
                          is labelled as one. When the platform grows a
                          full-day-aware anon entry point, only
                          submitGround() changes.

         FACILITY CODES, as of migration 2026-08-18c. 'nets' IS NO LONGER A
         FACILITY — slot_price('ska','nets',…) raises 'unknown sport'. The
         four nets are two facilities because they are priced apart:
             astro    A1 A2      matting  M1 M2      ground  G1
         NETS below is a TRACK through this page, not a sport, and is never
         sent to the database. `sport` is what goes over the wire. */
      var NETS = "nets";                       // UI track only. Never sent.
      var GROUND = "ground";
      var SURFACES = ["astro", "matting"];
      var SURFACE_NAME = { astro: "astro nets", matting: "matting nets" };

      /* request_booking's own window, mirrored only to draw the grid; the
         server re-checks it and its answer wins. */
      var HOUR_FROM = 6, HOUR_TO = 22;
      /* Facility counts, read from the tenant row so the app and the
         database cannot disagree. Fallbacks only. Never money. */
      var COURTS_FALLBACK = { astro: 2, matting: 2, ground: 1 };

      /* Fourteen chips. request_booking accepts +90, which is what the
         "Other date" input is for — the strip is the common case, not the
         whole capability. */
      var STRIP_DAYS = 14;
      /* Availability for every chip on the strip, not just the chosen day.
         null until the range read lands, and null forever if it fails —
         "unknown" is a state the chips must render honestly rather than
         guessing at. */
      var stripSlots = null;
      var DAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      var MON_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      var el = {
        head:    LT.$("#bkHead"),
        steps:   LT.$("#bkSteps"),
        s2:      LT.$("#step2"),
        s3:      LT.$("#step3"),
        s4:      LT.$("#step4"),
        s5:      LT.$("#step5"),
        facPick: LT.$("#facPick"),
        surfPick:LT.$("#surfPick"),
        strip:   LT.$("#dayStrip"),
        daySel:  LT.$("#daySel"),
        otherBtn:LT.$("#otherDateBtn"),
        otherWrap:LT.$("#otherDateWrap"),
        date:    LT.$("#bkDate"),
        ground:  LT.$("#groundState"),
        grid:    LT.$("#slotGrid"),
        selCount:LT.$("#selCount"),
        detailsNum: LT.$("#detailsNum"),
        refresh: LT.$("#refreshBtn"),
        form:    LT.$("#bkForm"),
        name:    LT.$("#bkName"),
        phone:   LT.$("#bkPhone"),
        msg:     LT.$("#bkMsg"),
        submit:  LT.$("#bkSubmit"),
        quote:     LT.$("#bkQuote"),
        quoteLab:  LT.$("#bkQuoteLab"),
        quoteAmt:  LT.$("#bkQuoteAmt"),
        quoteNote: LT.$("#bkQuoteNote"),
        done:      LT.$("#doneCard"),
        doneTitle: LT.$("#doneTitle"),
        doneDetail:LT.$("#doneDetail"),
        doneLines: LT.$("#doneLines"),
        doneHonest:LT.$("#doneHonest"),
        pay:       LT.$("#payBlock"),
        payAmt:    LT.$("#payAmt"),
        payBtn:    LT.$("#payBtn"),
        payVpa:    LT.$("#payVpa"),
        payCopy:   LT.$("#payCopy"),
        payNote:   LT.$("#payNote"),
        again:     LT.$("#againBtn")
      };

      /* `slots` stays null when a read fails, which keeps "we do not know"
         distinct from "nothing is booked". Nothing renders off a null. */
      var track = "";        // "" | NETS | GROUND — which path through the page
      var sport = "";        // "" | astro | matting | ground — the DB facility
      var selected = [];
      var slots = null, slotsAt = 0, loadErr = null;
      var courts = { astro: COURTS_FALLBACK.astro, matting: COURTS_FALLBACK.matting, ground: COURTS_FALLBACK.ground };
      /* The per-hour figure for each surface, straight from public_quote().
         null means "not known", and a null renders as nothing at all. */
      var surfUnit = { astro: null, matting: null };
      var reqSeq = 0, rateSeq = 0, sending = false, lastOpen = false;

      function longDate(iso) { return iso ? LT.dayName(iso) + ", " + LT.shortDate(iso) : ""; }
      function plural(n, one, many) { return n === 1 ? one : many; }
      function say(t, bad) { el.msg.textContent = t || ""; el.msg.className = bad ? "form-msg error" : "form-msg"; }
      function reduceMotion() {
        try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
      }

      /* Every string below is one a real code path raises — request_booking
         (schema.sql:432), submit_application, public_quote, or cloud.js's
         rewrites. */
      function readable(m) {
        m = String(m || "");
        if (/no connection|failed to fetch|networkerror|load failed/i.test(m)) return "No connection — please try again.";
        if (/slot full|all courts taken|every court is booked|just been taken|duplicate key|unique_violation/i.test(m)) return "Those nets have just been taken — please pick another hour.";
        if (/too many pending requests/i.test(m)) return "This number already has requests waiting. The academy will call you.";
        if (/desk is catching up/i.test(m)) return "The desk is catching up on today's requests. Please try again later.";
        if (/too many requests/i.test(m)) return "We already have an enquiry from this number today.";
        if (/valid phone required/i.test(m)) return "Please enter a 10-digit mobile number.";
        if (/name required/i.test(m)) return "Please enter your name.";
        if (/date too far ahead|pick a date within/i.test(m)) return "Requests open up to 90 days ahead. Please pick an earlier date.";
        if (/date in the past/i.test(m)) return "That date has passed. Please pick today or later.";
        if (/invalid hour/i.test(m)) return "The nets are bookable between 6 AM and 11 PM.";
        if (/unknown sport|no rate configured|unknown academy/i.test(m)) return "That facility is not open for online requests yet.";
        if (/not authorised|permission denied|jwt/i.test(m)) return "Online requests are closed at the moment.";
        return m;
      }

      /* Coarse reason only — an event never carries a name, number or amount. */
      function classify(m) {
        m = String(m || "");
        if (/no connection|failed to fetch|networkerror|load failed/i.test(m)) return "network";
        if (/slot full|all courts taken|just been taken/i.test(m)) return "slot_full";
        if (/too many pending|too many requests|desk is catching up/i.test(m)) return "rate_limited";
        if (/valid phone required|name required/i.test(m)) return "bad_input";
        if (/date too far ahead|date in the past|invalid hour/i.test(m)) return "bad_slot";
        return "other";
      }

      /* ============================================================
         THE DAY STRIP
         ============================================================ */
      function buildStrip() {
        var now = new Date(), html = "", prevMon = -1;
        for (var i = 0; i < STRIP_DAYS; i++) {
          /* Built from y/m/d + i so month and year roll over correctly, and
             in LOCAL time — LT.isoDate exists because toISOString() reports
             yesterday before 05:30 IST. */
          var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
          var iso = LT.isoDate(d);
          var wd = i > 1;
          var top = i === 0 ? "Today" : i === 1 ? "Tomorrow" : DAY_SHORT[d.getDay()];
          var mon = d.getMonth() !== prevMon ? MON_SHORT[d.getMonth()] : "";
          prevMon = d.getMonth();
          var label = (i === 0 ? "Today" : i === 1 ? "Tomorrow" : LT.dayName(iso)) + ", " + LT.shortDate(iso);
          html +=
            '<button type="button" role="radio" class="day-chip" data-d="' + LT.esc(iso) + '"' +
            ' aria-checked="false" tabindex="-1" aria-label="' + LT.esc(label) + '">' +
            '<span class="dc-top' + (wd ? " wd" : "") + '">' + LT.esc(top) + "</span>" +
            '<span class="dc-num">' + LT.esc(String(d.getDate())) + "</span>" +
            '<span class="dc-mon">' + LT.esc(mon) + "</span></button>";
        }
        el.strip.innerHTML = html;
      }

      /* Paints the strip from el.date.value — which stays the single source
         of truth for the chosen date, so the chips and the native input can
         never disagree. Returns the checked chip, or null when the date is
         outside the fourteen (picked through "Other date"). */
      /* Is the GROUND sold on this date?

         Only the ground gets a verdict. A net day is "full" only if every
         hour on every court is taken, which is rare and expensive to be
         wrong about — a chip that says "sold" when two nets are free costs
         the academy a booking. The ground is a single all-day unit, so
         "taken" is a fact rather than an estimate, and it is the case that
         actually bites: one booking removes the whole day. */
      function groundSoldOn(iso) {
        if (!stripSlots) return null;                 // unknown, not free
        var n = 0;
        for (var i = 0; i < stripSlots.length; i++) {
          var r = stripSlots[i];
          if (r.sport === GROUND && String(r.date) === iso) n++;
        }
        return n >= courts.ground;
      }

      function paintStrip() {
        var cur = el.date.value, found = null;
        LT.$$(".day-chip", el.strip).forEach(function (c) {
          var iso = c.getAttribute("data-d");
          var on = iso === cur;
          c.classList.toggle("on", on);
          c.setAttribute("aria-checked", on ? "true" : "false");

          /* Sold days are marked only on the GROUND track — on the nets
             track the same day may have plenty free, and carrying a mark
             across would be a lie. Left CLICKABLE on purpose: tapping shows
             the sentence explaining what to do, which a disabled chip
             cannot. */
          var sold = (track === GROUND) && groundSoldOn(iso) === true;
          c.classList.toggle("sold", sold);
          var base = c.getAttribute("data-label") || c.getAttribute("aria-label") || "";
          if (!c.getAttribute("data-label")) c.setAttribute("data-label", base);
          c.setAttribute("aria-label", sold ? base + " — already booked" : base);
          /* Roving tabindex: one stop for the whole group, as a radiogroup
             should be — seventeen tab stops would be worse than the OS
             control this replaced. */
          c.tabIndex = on ? 0 : -1;
          if (on) found = c;
        });
        if (!found && el.strip.firstElementChild) el.strip.firstElementChild.tabIndex = 0;
        el.daySel.textContent = cur ? longDate(cur) : "";
        return found;
      }

      function centreChip(chip, smooth) {
        if (!chip || !el.strip) return;
        /* .day-strip is position:relative, so offsetLeft is measured from
           the strip itself rather than from whatever is positioned above it. */
        var target = chip.offsetLeft - (el.strip.clientWidth - chip.offsetWidth) / 2;
        if (target < 0) target = 0;
        if (smooth && !reduceMotion() && "scrollBehavior" in document.documentElement.style) {
          el.strip.scrollTo({ left: target, behavior: "smooth" });
        } else {
          el.strip.scrollLeft = target;
        }
      }

      /* THE one place the date changes. Everything downstream of a date —
         availability, the two surface rates, the quote — is re-read here,
         so a slot taken five minutes ago cannot still show free and a rate
         is never carried across from another day. */
      function commitDate(iso) {
        if (!iso) return;
        var changed = iso !== el.date.value;
        el.date.value = iso;
        centreChip(paintStrip(), true);
        if (!changed) return;
        selected = []; say("");
        loadAvailability();
        loadSurfaceRates();
      }

      el.strip.addEventListener("click", function (e) {
        var c = e.target.closest ? e.target.closest(".day-chip") : null;
        if (c) commitDate(c.getAttribute("data-d"));
      });

      /* A real radiogroup: left/right move the selection AND the focus, and
         Home/End jump to the ends. Space and Enter come free — these are
         <button>s, so the click handler above already answers them. */
      el.strip.addEventListener("keydown", function (e) {
        var chips = LT.$$(".day-chip", el.strip);
        if (!chips.length) return;
        var i = chips.indexOf(document.activeElement);
        if (i === -1) { for (var j = 0; j < chips.length; j++) if (chips[j].classList.contains("on")) { i = j; break; } }
        if (i === -1) i = 0;

        var next;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") next = i + 1;
        else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = i - 1;
        else if (e.key === "Home") next = 0;
        else if (e.key === "End") next = chips.length - 1;
        else return;

        e.preventDefault();
        if (next < 0) next = 0;
        if (next > chips.length - 1) next = chips.length - 1;
        /* preventScroll, then centre by hand: letting the browser scroll a
           focused chip into view also scrolls the PAGE, which throws the
           step out from under the reader's eye. */
        try { chips[next].focus({ preventScroll: true }); } catch (err) { chips[next].focus(); }
        commitDate(chips[next].getAttribute("data-d"));
      });

      el.otherBtn.addEventListener("click", function () {
        var open = el.otherWrap.hidden;
        el.otherWrap.hidden = !open;
        el.otherBtn.setAttribute("aria-expanded", open ? "true" : "false");
        if (open) el.date.focus();
      });

      /* The native input is still the +90-day capability, just no longer
         the primary control. */
      el.date.addEventListener("change", function () { commitDate(el.date.value); });

      /* ============================================================
         AVAILABILITY
         Two reads fired together, not one after the other: a round trip is
         ~180 ms to Tokyo and the network is ~97% of it. Slots are required;
         the tenant read is optional and falls back.
         ============================================================ */
      function loadAvailability() {
        var date = el.date.value;
        if (!date) return;
        var seq = ++reqSeq;
        loadErr = null; slots = null;
        render();

        /* THE WHOLE FORTNIGHT, not just the chosen day.
           The strip previously knew nothing about availability, so a family
           learned a day was sold only by tapping it — and for the ground,
           which is sold whole days at a time, that is the single most
           useful thing a date picker could tell them. One extra read for
           fourteen days is cheaper than the tap-and-back-out it replaces:
           the flight to Tokyo is ~180ms and this rides alongside the reads
           already in flight. */
        var stripFrom = LT.isoDate(new Date());
        var stripTo = LT.isoDate(new Date(Date.now() + (STRIP_DAYS - 1) * 86400000));

        Promise.all([
          LT_CLOUD.publicSlots(date, date),
          LT_CLOUD.tenantConfig().catch(function () { return null; }),
          /* Never fatal: the strip falls back to plain chips, which is what
             it has always been. A failed range read must not take the
             booking form down with it. */
          LT_CLOUD.publicSlots(stripFrom, stripTo).catch(function () { return null; })
        ]).then(function (out) {
          if (seq !== reqSeq) return;
          var cfg = out[1] && out[1].config;
          if (cfg && cfg.courts) {
            /* astro / matting / ground — the codes migration 2026-08-18c
               writes. A missing key falls back rather than reading 0 nets. */
            ["astro", "matting", "ground"].forEach(function (k) {
              var n = Number(cfg.courts[k]);
              courts[k] = n > 0 ? n : COURTS_FALLBACK[k];
            });
          }
          slots = out[0] || [];
          stripSlots = out[2] || null;
          slotsAt = Date.now();
          renderSurfaces();
          render();
          /* The chips are painted on REVEAL, not on render — renderSteps()
             only calls paintStrip() when step 2 is freshly shown. So the
             sold marks never appeared: the availability lands long after
             the strip is already on screen. Repaint here, where the answer
             actually arrives. */
          paintStrip();
        }).catch(function (err) {
          if (seq !== reqSeq) return;
          slots = null; loadErr = err;
          render();
        });
      }

      /* public_slots already excludes cancelled rows, and a pending website
         request still holds the slot. Counting courts is not money.
         FILTERED BY FACILITY: public_slots returns every facility's rows, so
         an unfiltered count would tell an astro customer that a matting net
         is taken. */
      function takenAt(code, hour) {
        if (!slots) return 0;
        var n = 0;
        for (var i = 0; i < slots.length; i++) if (slots[i].sport === code && Number(slots[i].hour) === hour) n++;
        return n;
      }
      function groundTaken() {
        if (!slots) return 0;
        var n = 0;
        for (var i = 0; i < slots.length; i++) if (slots[i].sport === GROUND) n++;
        return n;
      }
      function groundOk() {
        if (loadErr) return true;      // could not check; an enquiry is still fine
        if (!slots) return false;      // still checking
        return groundTaken() < courts.ground;
      }

      /* ============================================================
         SURFACE CARDS
         The two figures on these cards come from public_quote(code, date,
         []) — with no hours the RPC returns the per-hour `unit` and a total
         of 0, which is exactly what "₹500 / hour" needs. There is no rate
         in this file to fall back to, deliberately: a card with no price is
         honest, a card with a stale one is not.
         ============================================================ */
      function loadSurfaceRates() {
        if (track !== NETS || !el.date.value) return;
        var mine = ++rateSeq, date = el.date.value;
        surfUnit = { astro: null, matting: null };
        renderSurfaces();
        /* Both fired together — see the round-trip note above. */
        SURFACES.forEach(function (code) {
          LT_CLOUD.publicQuote(code, date, []).then(function (q) {
            if (mine !== rateSeq) return;
            if (q && q.unit != null) surfUnit[code] = q.unit;
            renderSurfaces();
          }).catch(function () {
            if (mine !== rateSeq) return;
            renderSurfaces();          // stays blank. Never a guessed figure.
          });
        });
      }

      function renderSurfaces() {
        SURFACES.forEach(function (code) {
          var rate = LT.$('[data-rate="' + code + '"]', el.surfPick);
          var cnt  = LT.$('[data-count="' + code + '"]', el.surfPick);
          if (cnt) cnt.textContent = courts[code] + plural(courts[code], " net", " nets");
          if (!rate) return;
          rate.textContent = surfUnit[code] == null ? "" : LT.fmtINR(surfUnit[code]) + " / hour";
        });
        LT.$$(".fac-card", el.surfPick).forEach(function (c) {
          var on = c.getAttribute("data-s") === sport;
          c.classList.toggle("active", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      /* ---------- nets grid ---------- */
      function renderSlots() {
        if (loadErr) {
          /* A failed read says so and shows nothing else. Painting every
             hour as free would be inventing availability. */
          LT.fail(el.grid, loadErr);
          var d = document.createElement("div");
          d.className = "grid-dead";
          d.innerHTML = '<button type="button" class="btn btn-glass btn-sm" id="retryBtn">Try again</button>';
          el.grid.appendChild(d);
          var rb = LT.$("#retryBtn");
          if (rb) rb.addEventListener("click", loadAvailability);
          return;
        }
        if (!slots) { LT.skeleton(el.grid, 4); return; }

        var isToday = el.date.value === LT.today();
        var nowHour = new Date().getHours();
        var total = courts[sport] || 0;         // 2 for a surface, not 4
        var html = "", open = 0;

        for (var h = HOUR_FROM; h <= HOUR_TO; h++) {
          var past = isToday && h <= nowHour;
          var left = total - takenAt(sport, h);
          var full = left <= 0;
          if (!past && !full) open++;
          var sel = selected.indexOf(h) !== -1;
          var sub = past ? '<span class="faint">Passed</span>'
                  : full ? '<span class="sl-full">Full</span>'
                  : left === 1 ? '<span class="sl-left">Last net free</span>'
                  : LT.esc(left + " nets free");
          html += '<button type="button" class="slot' + (sel ? " sel" : "") + (past || full ? " taken" : "") +
                  '" data-h="' + h + '"' + (past || full ? " disabled" : "") +
                  ' aria-pressed="' + (sel ? "true" : "false") + '">' +
                  '<span class="sl-time">' + LT.esc(LT.hourLabel(h)) + "</span>" +
                  '<span class="sl-rate">' + sub + "</span></button>";
        }
        el.grid.innerHTML = html;

        /* A grid of seventeen greyed tiles is a dead end — offer the next
           date rather than leaving the visitor to find it. */
        if (open === 0) {
          var note = document.createElement("div");
          note.className = "grid-dead";
          note.innerHTML = "<span>" +
            (isToday && nowHour >= HOUR_TO ? "Today's last slot has started." : "Every net on this surface is taken.") +
            '</span><button type="button" class="btn btn-glass btn-sm" id="nextDayBtn">Try the next day</button>';
          el.grid.appendChild(note);
          var nd = LT.$("#nextDayBtn");
          if (nd) nd.addEventListener("click", function () {
            var d2 = new Date(el.date.value + "T00:00:00");
            d2.setDate(d2.getDate() + 1);
            commitDate(LT.isoDate(d2));
          });
        }
      }

      /* ---------- ground: availability only, never a rate ---------- */
      function renderGround() {
        if (loadErr) {
          el.ground.innerHTML = '<div class="cell-status gold">Could not check this date</div>';
        } else if (!slots) {
          LT.skeleton(el.ground, 1);
        } else if (groundTaken() >= courts.ground) {
          /* Say what to do next. "Taken" alone leaves a family staring at a
             dead end with no idea the next day might be free. */
          el.ground.innerHTML = '<div class="cell-status red">Taken on ' + LT.esc(longDate(el.date.value)) + "</div>" +
            '<div class="hint" style="margin-top:8px;">The whole ground is booked that day. Pick another date above — ' +
            "or call the academy and they will tell you what is free.</div>";
        } else {
          el.ground.innerHTML = '<div class="cell-status green">Free on ' + LT.esc(longDate(el.date.value)) + "</div>";
        }
      }

      /* ---------- progressive reveal ----------
         A step appears once the one above it is answered. The date is
         pre-filled with today, so choosing a facility answers step 2 too.

         The details step does not disappear again once it is open. It holds
         the name, the number AND the error message, so hiding it when the
         last hour is deselected would throw away typing — and a failed send
         clears the selection, which would take the very message explaining
         the failure off the screen with it. */
      function renderSteps() {
        var nets = track === NETS;
        var haveDate = !!el.date.value;
        var haveSurface = nets && !!sport;
        if (haveDate && (nets ? (haveSurface && selected.length > 0) : groundOk())) lastOpen = true;

        /* ...but the GROUND closes it again when the day is gone.
           lastOpen latches on purpose: for nets it holds the half-typed
           name and the error message, and hiding it when the last hour is
           deselected would throw both away. The ground has no hours, so
           the only thing that can change is the DAY — and a day that is
           already sold must not keep a price and a "Book the ground"
           button underneath a line reading "Taken".

           The button was disabled and the server's unique index would have
           refused it, so nothing could actually be double-sold; it simply
           read as bookable, which is its own kind of wrong.

           Only when we KNOW: slots loaded, no read error, genuinely full.
           A date still being checked leaves the step alone. */
        if (!nets && slots && !loadErr && groundTaken() >= courts.ground) lastOpen = false;

        var fresh = [];
        function step(node, on) {
          var was = !node.hidden;
          node.hidden = !on;
          if (on && !was) fresh.push(node);
        }
        step(el.s2, !!track);
        step(el.s3, nets && haveDate);
        step(el.s4, nets && haveDate && haveSurface);
        step(el.s5, lastOpen);

        el.ground.hidden = nets || !haveDate;
        /* The ground has no surface and no hours step, so its details step
           is 3 — a contiguous 1-2-3, not a 5 with two gaps above it. */
        el.detailsNum.textContent = nets ? "5" : "3";
        el.selCount.hidden = !selected.length;
        el.selCount.textContent = selected.length + plural(selected.length, " hour", " hours");
        syncSubmit();

        /* Re-quote whenever the selection, the date, the surface or the
           facility moves. Hooked here rather than in render(), because
           picking an hour calls renderSteps() ALONE — quoting from render()
           would miss exactly the change that alters the price. */
        loadQuote();

        /* The strip is inside step 2, so it has no width until step 2 is
           first shown; centring before that measures a zero-width box. */
        if (fresh.indexOf(el.s2) !== -1) centreChip(paintStrip(), false);

        /* Scroll the newest step into view on narrow screens only — on a
           desktop the whole flow is already visible. */
        if (fresh.length && window.innerWidth < 720) {
          var last = fresh[fresh.length - 1];
          setTimeout(function () { last.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80);
        }
      }

      /* Availability + steps. Selecting an hour calls renderSteps() ALONE:
         redrawing the grid would replace the tile just activated, so a
         keyboard user loses focus to <body> after every Enter and a touch
         user sees a flicker. The other tiles' numbers have not changed. */
      function render() {
        if (track === GROUND) renderGround();
        else if (track === NETS && sport) renderSlots();
        renderSteps();
      }

      function valid() {
        if (String(el.name.value || "").trim().length < 2) return false;
        if (String(el.phone.value || "").replace(/\D/g, "").length < 10) return false;
        if (!el.date.value) return false;
        return track === NETS ? (!!sport && selected.length > 0) : groundOk();
      }
      function syncSubmit() {
        /* "Book" on both paths. The old wording ("Send request" / "Send
           enquiry") described the plumbing rather than the intent — the
           customer is booking. The success card still says plainly that
           the academy confirms it, which is where that caveat belongs. */
        el.submit.textContent = sending
          ? "Booking…"
          : (track === GROUND ? "Book the ground" : "Book");
        el.submit.disabled = sending || !valid();
      }

      /* ---------- the quote ----------
         Every figure comes back from public_quote(). The page holds no
         rate and does no arithmetic: `total` is what the database says the
         selection costs, so the screen and the charge cannot disagree.

         Requests are sequenced by a token — a fast tapper can have two in
         flight, and the slower one must not overwrite the newer answer. */
      var quoteSeq = 0;
      function clearQuote() { quoteSeq++; el.quote.hidden = true; }

      function loadQuote() {
        var host = el.quote;
        if (!host) return;
        if (!sport || !el.date.value) { clearQuote(); return; }
        var wantHours = track === NETS ? selected.slice() : [];
        if (track === NETS && !wantHours.length) { clearQuote(); return; }

        var mine = ++quoteSeq;
        el.quoteAmt.textContent = "…";
        el.quoteNote.textContent = "";
        host.hidden = false;

        LT_CLOUD.publicQuote(sport, el.date.value, wantHours).then(function (q) {
          if (mine !== quoteSeq || !q) return;
          /* NULL IS NOT ZERO. LT.fmtINR is `"₹" + Number(n || 0)…`, so a
             missing total renders as a confident "₹0" — which above a Book
             button, on a ₹25,000 ground day, is the worst wrong number
             this page could show. No figure beats a false one. */
          if (q.total == null) { clearQuote(); return; }
          el.quoteLab.textContent = q.full_day
            ? "Full day · " + LT.shortDate(el.date.value)
            : wantHours.length + (wantHours.length === 1 ? " hour" : " hours") +
              (q.unit == null ? "" : " × " + LT.fmtINR(q.unit));
          el.quoteAmt.textContent = LT.fmtINR(q.total);
          el.quoteNote.textContent = q.note || "";
        }).catch(function () {
          if (mine !== quoteSeq) return;
          /* A quote that cannot be fetched says so and gets out of the
             way. It must never fall back to a number this page made up —
             that is the one failure that would be worse than silence. */
          clearQuote();
        });
      }

      function setTrack(next) {
        track = next === GROUND ? GROUND : NETS;
        /* Sold marks are ground-only, so switching track changes what the
           chips should say even though no new data has arrived. */
        paintStrip();
        sport = track === GROUND ? GROUND : "";     // the surface is still unanswered
        selected = []; lastOpen = false; say("");
        LT.$$(".fac-card", el.facPick).forEach(function (c) {
          var on = c.getAttribute("data-f") === track;
          c.classList.toggle("active", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
        renderSurfaces();
        loadAvailability();
        loadSurfaceRates();
      }

      /* Changing the surface needs NO new availability read: public_slots
         returned every facility's rows for this date already, and the grid
         simply counts a different one. One round trip saved per tap. */
      function setSurface(code) {
        if (SURFACES.indexOf(code) === -1) return;
        sport = code;
        selected = []; say("");
        renderSurfaces();
        render();
      }

      /* ---------- submit ----------
         One request_booking per hour. Each is priced, capacity-checked and
         rate-limited by Postgres; nothing here decides anything. Partial
         success is real — hour 7 can land while hour 8 fills — so each
         result is settled and reported individually. */
      function settle(p) {
        return p.then(function (v) { return { ok: true, value: v }; },
                      function (e) { return { ok: false, error: e }; });
      }

      function submitNets(name, phone) {
        var date = el.date.value;
        var code = sport;
        var hours = selected.slice().sort(function (a, b) { return a - b; });
        return Promise.all(hours.map(function (h) {
          return settle(LT_CLOUD.requestBooking({ sport: code, date: date, hour: h, name: name, phone: phone }))
            .then(function (r) { r.hour = h; return r; });
        })).then(function (results) {
          var ok = results.filter(function (r) { return r.ok; });
          var bad = results.filter(function (r) { return !r.ok; });

          if (!ok.length) {
            var first = bad.length ? String(bad[0].error && bad[0].error.message) : "";
            say(readable(first) || "Something went wrong. Please try again.", true);
            LT_CLOUD.track("booking_request_failed", { sport: code, reason: classify(first) });
            selected = [];
            loadAvailability();
            return;
          }

          LT_CLOUD.track("booking_requested", { sport: code, hours: ok.length });
          el.doneTitle.textContent = "Request received";
          el.doneDetail.innerHTML = "Thanks, <strong>" + LT.esc(name) + "</strong> — " + ok.length +
            plural(ok.length, " hour", " hours") + " on the <strong>" + LT.esc(SURFACE_NAME[code] || code) +
            "</strong> on <strong>" + LT.esc(longDate(date)) + "</strong>.";

          /* Each amount is the figure request_booking RETURNED for that
             hour. Printed one per line and never added up here: a total
             this page invented is a number no database agreed to. */
          el.doneLines.innerHTML = ok.map(function (r) {
            var amt = r.value && r.value.amount;
            return '<div class="dl"><span>' + LT.esc(LT.hourLabel(r.hour)) + "</span><b>" +
                   (amt == null ? "—" : LT.esc(LT.fmtINR(amt))) + "</b></div>";
          }).join("");

          el.doneHonest.innerHTML =
            "This is a request, not a confirmed booking — the academy confirms your net and shares payment details." +
            (bad.length ? "<br />" + bad.length + plural(bad.length, " hour was", " hours were") + " not requested: " +
              LT.esc(readable(String(bad[0].error && bad[0].error.message))) : "");

          showDone();
          offerPayment(ok, code, date);
        });
      }

      /* THE GROUND IS A BOOKING REQUEST, exactly like a net.

         It used to call submit_application(), because request_booking()
         began with `if p_hour < 6` and a full day is the hour-0 sentinel.
         The cost of that workaround was high: a person hiring a field for
         a day landed in the ADMISSIONS inbox with no consent, no date of
         birth and no parent — because a renter has none — and approving
         one would have created a member and an enrolment, putting a
         cricket student who never enrolled onto the roster, into every
         register and into the fee chase. It also wrote no booking, so the
         day was never held and two people could ask for the same ground.

         Migration 2026-08-19g taught request_booking about full-day
         facilities, so the ground now takes the same road as the nets: a
         PENDING booking that holds the date, priced by the server for that
         weekday, confirmed from the bookings board.

         The hour sent here is ignored — the server forces 0 from config,
         because trusting a client to send the sentinel is how the unique
         index gets bypassed. */
      function submitGround(name, phone) {
        var date = el.date.value;
        return LT_CLOUD.requestBooking({
          sport: GROUND, date: date, hour: 0, name: name, phone: phone
        }).then(function () {
          LT_CLOUD.track("ground_enquiry", { sport: GROUND });
          el.doneTitle.textContent = "Enquiry received";
          el.doneDetail.innerHTML = "Thanks, <strong>" + LT.esc(name) + "</strong> — the main ground on <strong>" +
            LT.esc(longDate(date)) + "</strong>.";
          el.doneLines.innerHTML = "";
          el.doneHonest.textContent = "The date is held for you. The academy will call to confirm it — nothing is payable until they do.";
          showDone();
        }).catch(function (err) {
          var m = String((err && err.message) || "");
          say(readable(m) || "Something went wrong. Please try again.", true);
          LT_CLOUD.track("ground_enquiry_failed", { reason: classify(m) });
        });
      }

      /* ============================================================
         PAY BY UPI — optional, and only ever on figures the server gave
         ============================================================
         TWO things must come from the database or this block does not
         render at all:

         1. THE HANDLE comes from public_quote().pay — { vpa, payee } —
            which Postgres fills from the academy's own billing config
            (migration 2026-08-18d). There is NO fallback VPA in this file
            and there must never be one: a wrong payment handle sends a
            customer's money to a stranger, silently, and the customer has
            no way to tell. A missing handle comes back as `pay: null`, so
            "not configured" and "could not read" both end in no button —
            the only two safe outcomes.

            WHY NOT resolve_upi(): it is the function that owns where a fee
            is collected, but its first line is assert_staff_or_service()
            and this page has no session. SECURITY DEFINER changes the
            database role, not the JWT, so an anonymous visitor is refused
            INSIDE it — verified over HTTP, anon gets 42501. Wiring this to
            resolve_upi meant the payment block could never appear at all.

            The narrow read that replaced it is deliberately narrow: a court
            rental booked from a public page has no enrolment and no group,
            so the academy-level handle is not a fallback here — it is the
            only branch of that chain which can ever apply. If a rental ever
            needs to collect somewhere else, that belongs in resolve_upi
            behind a public-safe wrapper, not in this file.

         2. THE AMOUNT. One booked hour → the amount request_booking itself
            returned. Several → public_quote() re-run over exactly the hours
            that LANDED, which is a figure Postgres computed for that set.
            This page never adds the per-hour amounts together; if the
            re-quote fails there is simply no payment option.
            (Worth knowing: request_booking prices through slot_rate() and
            public_quote through slot_price(). They agree for ska today —
            the nets are flat, peak == offPeak — but they are different
            functions, so a future evening premium set on one and not the
            other would show a total here that differs from the sum charged.
            Reconciling those two is platform work.) */
      function dueAmount(ok, code, date) {
        if (ok.length === 1) {
          var a = ok[0].value && ok[0].value.amount;
          return Promise.resolve(a == null ? null : a);
        }
        var hours = ok.map(function (r) { return r.hour; });
        return LT_CLOUD.publicQuote(code, date, hours).then(function (q) {
          return (q && q.total != null) ? q.total : null;
        }).catch(function () { return null; });
      }

      function upiLink(vpa, payee, amount, ref) {
        /* Every part encoded — a payee name with an ampersand in it would
           otherwise silently truncate the amount out of the link. */
        return "upi://pay?pa=" + encodeURIComponent(vpa) +
               "&pn=" + encodeURIComponent(payee || "") +
               "&am=" + encodeURIComponent(String(amount)) +
               "&cu=INR" +
               "&tn=" + encodeURIComponent(ref || "");
      }

      /* WHERE TO PAY comes from public_quote(), NOT from resolve_upi().

         resolve_upi() is the shared function that owns which account money
         is collected to, and its first line is assert_staff_or_service().
         This page has no session, and SECURITY DEFINER changes the database
         role, not the JWT — so an anonymous visitor is refused inside it.
         Verified over HTTP: anon gets 42501. Calling it here meant the
         payment block could never appear at all.

         public_quote returns `pay: { vpa, payee }` for exactly this
         (migration 2026-08-18d), computed server-side from the academy's
         own billing config, and `pay` is null when no handle is set — so
         "no handle" and "could not read" both end in no button, which is
         the only safe outcome. */
      function payTo(code, date, hours) {
        return LT_CLOUD.publicQuote(code, date, hours)
          .then(function (q) {
            var p = q && q.pay;
            return (p && p.vpa) ? p : null;
          })
          .catch(function () { return null; });
      }

      function offerPayment(ok, code, date) {
        el.pay.hidden = true;
        if (!ok.length) return;

        /* The booking reference the academy will match the payment against.
           `tn` is short in most UPI apps, so several hours ride as one ref
           plus a count rather than a wall of ids. */
        var first = ok[0].value && ok[0].value.id;
        if (!first) return;
        var ref = ok.length === 1 ? String(first) : String(first) + " +" + (ok.length - 1);

        var landed = ok.map(function (r) { return r.hour; });
        Promise.all([dueAmount(ok, code, date), payTo(code, date, landed)])
          .then(function (out) {
            var amount = out[0];
            var p = out[1];
            var vpa = p && p.vpa;
            /* The payee NAME may fall back to a display string — it is a
               label, not a destination, so a wrong one cannot misdirect
               money. The VPA may never fall back to anything. */
            var payee = (p && p.payee) || "Super Kings Academy";
            /* Both, or nothing. No figure and no handle may be invented. */
            if (amount == null || !vpa) return;

            el.payAmt.textContent = LT.fmtINR(amount);
            el.payBtn.textContent = "Pay " + LT.fmtINR(amount) + " by UPI";
            el.payBtn.setAttribute("href", upiLink(vpa, payee, amount, ref));
            el.payVpa.textContent = vpa;
            el.payCopy.dataset.vpa = vpa;
            el.payNote.textContent =
              "Paying now is optional. The academy still confirms your slot — a payment on its own does not reserve anything.";
            el.pay.hidden = false;
            LT_CLOUD.track("upi_offered", { sport: code, hours: ok.length });
          })
          .catch(function () { /* no handle, no figure, no button */ });
      }

      el.payCopy.addEventListener("click", function () {
        var v = el.payCopy.dataset.vpa || el.payVpa.textContent || "";
        if (!v) return;
        function fallback() {
          /* Selecting it is the honest fallback — the visitor copies it
             themselves rather than being told it was copied when it was not. */
          try {
            var r = document.createRange();
            r.selectNodeContents(el.payVpa);
            var s = window.getSelection();
            s.removeAllRanges(); s.addRange(r);
          } catch (e) {}
          LT.toast("Select and copy the UPI id.");
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(v).then(function () { LT.toast("UPI id copied."); }, fallback);
        } else {
          fallback();
        }
      });

      el.payBtn.addEventListener("click", function () {
        LT_CLOUD.track("upi_opened", { sport: sport });
      });

      function showDone() {
        selected = [];
        /* Hidden until offerPayment() has BOTH a server handle and a server
           figure. The ground path never calls it, so this is also what
           keeps a previous booking's amount off an enquiry card. */
        el.pay.hidden = true;
        el.head.style.display = "none";
        el.steps.style.display = "none";
        el.done.classList.add("show");
        window.scrollTo({ top: 0, behavior: "smooth" });
        LT.toast(track === GROUND ? "Enquiry sent." : "Request sent.");
      }

      function busy(on) {
        sending = on;
        el.name.disabled = on; el.phone.disabled = on;
        syncSubmit();
      }

      /* ---------- wiring ---------- */
      buildStrip();
      el.date.value = LT.today();
      el.date.min = LT.today();
      /* 90 days is request_booking's ceiling, computed against the
         database's current_date — the input is a hint, the server decides. */
      var maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 90);
      el.date.max = LT.isoDate(maxDate);
      paintStrip();

      el.facPick.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".fac-card") : null;
        if (btn) setTrack(btn.getAttribute("data-f"));
      });

      el.surfPick.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".fac-card") : null;
        if (btn) setSurface(btn.getAttribute("data-s"));
      });

      /* Paints THAT tile, then re-runs the steps only — see render(). */
      el.grid.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".slot") : null;
        if (!btn || btn.disabled) return;
        say("");
        var h = Number(btn.getAttribute("data-h"));
        var i = selected.indexOf(h);
        var on = i === -1;
        if (on) selected.push(h); else selected.splice(i, 1);
        btn.classList.toggle("sel", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        renderSteps();
      });

      el.refresh.addEventListener("click", loadAvailability);
      el.name.addEventListener("input", syncSubmit);
      el.phone.addEventListener("input", syncSubmit);

      /* A page left open in a pocket goes stale. */
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        if (el.done.classList.contains("show") || !track) return;
        if (Date.now() - slotsAt > 60000) loadAvailability();
      });

      el.form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (sending) return;

        var name = String(el.name.value || "").trim();
        var digits = String(el.phone.value || "").replace(/\D/g, "");
        var phone = LT.phone10(digits);
        if (name.length < 2) { say("Please enter your name.", true); el.name.focus(); return; }
        if (digits.length < 10 || phone.length !== 10) { say("Please enter a 10-digit mobile number.", true); el.phone.focus(); return; }
        if (track === NETS && !sport) { say("Pick a surface first.", true); return; }
        if (track === NETS && !selected.length) { say("Pick at least one hour first.", true); return; }
        say("");

        busy(true);
        (track === GROUND ? submitGround(name, phone) : submitNets(name, phone))
          .catch(function (err) {
            /* Nothing above rejects in normal operation — this catches a
               genuine defect rather than losing it to an unhandled
               rejection. */
            say(readable(String((err && err.message) || "")) || "Something went wrong. Please try again.", true);
            LT_CLOUD.report("booking.submit", err);
          })
          .then(function () { busy(false); });
      });

      el.again.addEventListener("click", function () {
        selected = []; lastOpen = false;
        el.done.classList.remove("show");
        el.pay.hidden = true;
        el.head.style.display = "";
        el.steps.style.display = "";
        el.form.reset();
        say("");
        loadAvailability();
        loadSurfaceRates();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      /* Deep link: booking.html?facility=ground, and ?sport=astro or
         ?sport=matting land straight on a surface. ?facility=nets still
         works and simply opens the nets track with the surface unanswered —
         'nets' has not been a facility since 2026-08-18c, so it is honoured
         as a link, never sent to the database. Nothing is selected
         otherwise; step 1 is the first question. */
      var m = /[?&](?:facility|sport)=([^&]*)/.exec(location.search);
      var pre = "";
      if (m) { try { pre = decodeURIComponent(m[1]).toLowerCase(); } catch (e) { pre = ""; } }
      if (pre === GROUND) setTrack(GROUND);
      else if (SURFACES.indexOf(pre) !== -1) { setTrack(NETS); setSurface(pre); }
      else if (pre === NETS) setTrack(NETS);
      else render();
    })();
  </script>
</body>
</html>
