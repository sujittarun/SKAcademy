<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Book a net · Super Kings Academy</title>
<meta name="description" content="Book a practice net by the hour or enquire about the main ground at Super Kings Academy, VAKAMAN FE, Coimbatore. Live availability, no advance payment online." />
<script>
  /* blocking: applies the persisted theme before first paint, else the
     page renders dark and flashes. Raw string, not JSON. */
  try { document.documentElement.dataset.theme = localStorage.getItem("ska-theme") || "dark"; } catch (e) {}
  document.documentElement.className += " lt-js";
</script>
<link rel="stylesheet" href="assets/css/glass.css?v=8" />
<style>
  /* Page-local LAYOUT only. Glass, buttons, fields, pills, .slot,
     .form-msg and .lt-empty all come from glass.css. */
  .bk-wrap { max-width: 720px; margin: 0 auto; width: 100%; }

  .bk-head { text-align: center; }
  .bk-head h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; }
  .bk-head p { color: var(--ink-mid); margin-top: 6px; font-size: 14px; }

  /* One step per decision, revealed by dropping [hidden]. The !important
     is load-bearing: glass.css gives .pill display:inline-flex, and a
     class rule beats the browser's own [hidden]{display:none} — so the
     hour counter renders as a permanent empty gold pill without this. */
  [hidden] { display: none !important; }
  .steps { display: flex; flex-direction: column; gap: var(--gap-3); }
  .step:not([hidden]) { animation: lt-step-in .4s var(--ease-spring) both; }
  @media (prefers-reduced-motion: reduce) { .step:not([hidden]) { animation: none; } }

  .step-h { display: flex; align-items: center; gap: 10px; margin-bottom: var(--gap-3); }
  .step-h .n {
    width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; color: #231d00; background: var(--gold-grad);
  }
  .step-h h2 { font-size: 17px; font-weight: 700; }

  .fac-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .fac-pick { grid-template-columns: 1fr; } }
  .fac-card {
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    min-height: 56px; padding: 14px 16px; text-align: left; font: inherit; cursor: pointer;
    color: var(--ink-hi); background: var(--tile-bg);
    border: 1px solid var(--tile-border); border-radius: var(--r-md);
    transition: border-color .2s ease, background .2s ease;
  }
  .fac-card:hover { border-color: var(--input-border-hover); }
  .fac-card .fc-name { font-weight: 800; font-size: 15px; }
  .fac-card .fc-sub { font-size: 12px; color: var(--ink-mid); }
  .fac-card.active { border-color: var(--gold-400); background: rgba(247, 203, 21, .1); }
  .fac-card.active .fc-name { color: var(--tx-gold); }

  #bkDate { max-width: 240px; }
  #refreshBtn { min-height: 44px; }

  /* slot sub-labels. .slot itself is a design-system component. */
  .sl-full { color: var(--tx-red); font-weight: 700; }
  .sl-left { color: var(--tx-optic); font-weight: 700; }

  /* anything replacing or following the hour tiles spans the whole grid */
  .slot-grid .lt-empty, .grid-dead { grid-column: 1 / -1; }
  .grid-dead {
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    text-align: center; padding: 4px 0 2px; font-size: 13px; color: var(--ink-low);
  }

  .bk-form { display: flex; flex-direction: column; gap: var(--gap-3); }

  .done-card { text-align: center; padding: clamp(30px, 6vh, 52px) var(--gap-4); display: none; }
  .done-card.show { display: block; animation: lt-step-in .5s var(--ease-spring) both; }
  .done-card .big-check {
    width: 66px; height: 66px; margin: 0 auto var(--gap-3); border-radius: 50%;
    display: grid; place-items: center; background: rgba(52, 211, 153, .15);
    border: 1.5px solid rgba(52, 211, 153, .5); color: var(--tx-green);
  }
  .done-card .big-check svg { width: 30px; height: 30px; }
  .done-lines { display: flex; flex-direction: column; gap: 6px; max-width: 320px; margin: var(--gap-3) auto 0; }
  .done-lines .dl {
    display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px;
    border-radius: var(--r-sm); border: 1px solid var(--tile-border); background: var(--tile-bg);
    font-size: 13px; color: var(--ink-mid);
  }
  .done-lines .dl b { color: var(--ink-hi); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- The quote, shown before the Book button ----------
     Sits directly above the action it prices, so the figure and the
     commitment are read in one glance rather than one screen apart. */
  .quote {
    margin: var(--gap-3) 0 var(--gap-2);
    padding: 13px 15px;
    border-radius: var(--r-md);
    border: 1px solid var(--tile-border);
    background: var(--tile-bg);
  }
  .q-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .q-lab { font-size: 13px; color: var(--ink-mid); }
  .q-amt {
    font-size: 24px; font-weight: 800; color: var(--ink-hi);
    /* tabular so the figure does not jump sideways as it re-quotes */
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .q-note { margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: var(--ink-low); }
  @media (max-width: 420px) { .q-amt { font-size: 21px; } }
</style>
</head>
<body>
  <div class="lt-bg" aria-hidden="true"></div>

  <!-- PUBLIC page: no LT.managerShell(). The staff tabs, the sign-out
       button and the sample-data banner do not belong in front of a
       customer. public_slots, request_booking and submit_application are
       genuinely anon-executable, so this page works in DEV exactly as it
       will at go-live. -->
  <nav class="lt-nav glass">
    <a class="nav-brand" href="index.html">
      <span class="mark" data-logo="40"></span>
      <span class="t"><strong>Super Kings Academy</strong><span>VAKAMAN FE</span></span>
    </a>
    <div class="nav-actions">
      <button type="button" class="theme-toggle"></button>
      <a class="btn btn-ghost btn-sm hide-mobile" href="admission.html">Join coaching</a>
      <a class="btn btn-glass btn-sm" href="index.html">← Back to site</a>
    </div>
  </nav>

  <main class="lt-main lt-page">
    <div class="bk-wrap">
      <div class="bk-head" id="bkHead">
        <h1>Book at VAKAMAN FE</h1>
        <p>Nothing is paid online.</p>
      </div>

      <div class="steps mt-4" id="bkSteps">
        <!-- 1 · what -->
        <section class="glass glass-card tight step" id="step1">
          <div class="step-h"><span class="n">1</span><h2>What are you booking?</h2></div>
          <div class="fac-pick" id="facPick" role="group" aria-label="Choose a facility">
            <button type="button" class="fac-card" data-f="nets" aria-pressed="false">
              <span class="fc-name">Practice Nets</span>
              <span class="fc-sub">4 nets · Astro &amp; Matting</span>
            </button>
            <button type="button" class="fac-card" data-f="ground" aria-pressed="false">
              <span class="fc-name">Main Ground</span>
            </button>
          </div>
        </section>

        <!-- 2 · when -->
        <section class="glass glass-card tight step" id="step2" hidden>
          <div class="step-h"><span class="n">2</span><h2>Which day?</h2></div>
          <input type="date" id="bkDate" aria-label="Date" />
          <div class="mt-3" id="groundState" hidden></div>
        </section>

        <!-- 3 · hours (nets only — the ground is never hourly) -->
        <section class="glass glass-card tight step" id="step3" hidden>
          <div class="step-h">
            <span class="n">3</span><h2>Which hours?</h2>
            <span class="grow"></span>
            <span class="pill gold" id="selCount" hidden></span>
            <button type="button" class="btn btn-ghost btn-sm" id="refreshBtn" aria-label="Check availability again">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
            </button>
          </div>
          <div class="slot-grid" id="slotGrid"></div>
        </section>

        <!-- 4 · who, and 5 · send -->
        <section class="glass glass-card tight step" id="step4" hidden>
          <!-- the number is set in script: the ground has no hours step, so
               this is its step 3, not a 4 with a gap above it -->
          <div class="step-h"><span class="n" id="detailsNum">4</span><h2>Your details</h2></div>
          <form class="bk-form" id="bkForm" novalidate>
            <!-- NEVER prefill anything here. This repo is public and served
                 as a static site, so a value= attribute is published the
                 moment it is committed and stays in git history after it is
                 removed. These are also a customer's name and number, so
                 the page does not remember them between visits either. -->
            <label class="field">
              <span>Your name</span>
              <input type="text" id="bkName" name="name" autocomplete="name" autocapitalize="words" required />
            </label>
            <label class="field">
              <span>Mobile number</span>
              <input type="tel" id="bkPhone" name="phone" autocomplete="tel" inputmode="numeric"
                     placeholder="10-digit mobile" required />
            </label>
            <!-- What it costs, BEFORE committing. Filled by public_quote(),
                 which works the figure out in Postgres — this page never
                 multiplies hours by a rate and never holds one. -->
            <div class="quote" id="bkQuote" aria-live="polite" hidden>
              <div class="q-row">
                <span class="q-lab" id="bkQuoteLab">Total</span>
                <span class="q-amt" id="bkQuoteAmt">—</span>
              </div>
              <div class="q-note" id="bkQuoteNote"></div>
            </div>
            <div class="form-msg" id="bkMsg" role="status" aria-live="polite" style="min-height:0;"></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="bkSubmit" disabled>Book</button>
          </form>
        </section>
      </div>

      <!-- success -->
      <div class="glass done-card" id="doneCard">
        <div class="big-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2 id="doneTitle">Request received</h2>
        <p class="muted mt-2" id="doneDetail"></p>
        <div class="done-lines" id="doneLines"></div>
        <p class="faint mt-3" id="doneHonest" style="font-size:13px;line-height:1.55;"></p>
        <div class="mt-4 flex" style="justify-content:center; flex-wrap:wrap;">
          <button type="button" class="btn btn-primary" id="againBtn">Book again</button>
          <a class="btn btn-glass" href="index.html">Back to home</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/core.js?v=8"></script>
  <script src="assets/js/cloud.js?v=8"></script>
  <!-- dev-data.js loads for shell consistency and is DELIBERATELY NOT USED
       here. Sample rows behind the striped banner are a preview on a staff
       screen; on a public page they would be a customer shown invented
       availability with no way to tell. A failed read says "could not
       load" instead — an empty academy and a broken one must not look
       alike. -->
  <script src="assets/js/dev-data.js?v=8"></script>
  <script>
    /* page script last. core.js MUST NOT be in <head> — its ink-filter
       IIFE returns early if document.body is missing and never retries. */
    (function () {
      "use strict";

      /* WHAT AN ANONYMOUS VISITOR MAY ACTUALLY DO
         · availability → public_slots (no name, phone or amount in the view)
         · nets         → request_booking(), which writes a PENDING row with
                          no court for staff to confirm
         · the ground   → NOT request_booking. It raises 'invalid hour'
                          outside 6..22 and a full day is hour 0, and it
                          prices through slot_rate(), which has no key for
                          'ska's daily ground block. Both paths hard-fail,
                          so the ground is an ENQUIRY via
                          submit_application() and is labelled as one. When
                          the platform grows a full-day-aware anon entry
                          point, only submitGround() changes.
         · a price      → never. slot_price() is revoked from public and
                          anon, so this page cannot quote one. The only
                          figure it prints is the amount request_booking
                          RETURNS. No rate table, no arithmetic. */

      var NETS = "nets", GROUND = "ground";
      /* request_booking's own window, mirrored only to draw the grid; the
         server re-checks it and its answer wins. */
      var HOUR_FROM = 6, HOUR_TO = 22;
      /* Facility counts, read from the tenant row so the app and the
         database cannot disagree. Fallbacks only. Never money. */
      var COURTS_FALLBACK = { nets: 4, ground: 1 };

      var el = {
        head:    LT.$("#bkHead"),
        steps:   LT.$("#bkSteps"),
        s2:      LT.$("#step2"),
        s3:      LT.$("#step3"),
        s4:      LT.$("#step4"),
        facPick: LT.$("#facPick"),
        date:    LT.$("#bkDate"),
        ground:  LT.$("#groundState"),
        grid:    LT.$("#slotGrid"),
        selCount:LT.$("#selCount"),
        detailsNum: LT.$("#detailsNum"),
        refresh: LT.$("#refreshBtn"),
        form:    LT.$("#bkForm"),
        name:    LT.$("#bkName"),
        phone:   LT.$("#bkPhone"),
        msg:     LT.$("#bkMsg"),
        submit:  LT.$("#bkSubmit"),
        quote:     LT.$("#bkQuote"),
        quoteLab:  LT.$("#bkQuoteLab"),
        quoteAmt:  LT.$("#bkQuoteAmt"),
        quoteNote: LT.$("#bkQuoteNote"),
        done:      LT.$("#doneCard"),
        doneTitle: LT.$("#doneTitle"),
        doneDetail:LT.$("#doneDetail"),
        doneLines: LT.$("#doneLines"),
        doneHonest:LT.$("#doneHonest"),
        again:     LT.$("#againBtn")
      };

      /* `slots` stays null when a read fails, which keeps "we do not know"
         distinct from "nothing is booked". Nothing renders off a null. */
      var facility = "";
      var selected = [];
      var slots = null, slotsAt = 0, loadErr = null;
      var courts = { nets: COURTS_FALLBACK.nets, ground: COURTS_FALLBACK.ground };
      var reqSeq = 0, sending = false, step4Open = false;

      function longDate(iso) { return iso ? LT.dayName(iso) + ", " + LT.shortDate(iso) : ""; }
      function plural(n, one, many) { return n === 1 ? one : many; }
      function say(t, bad) { el.msg.textContent = t || ""; el.msg.className = bad ? "form-msg error" : "form-msg"; }

      /* Every string below is one a real code path raises — request_booking
         (schema.sql:432), submit_application, or cloud.js's rewrites. */
      function readable(m) {
        m = String(m || "");
        if (/no connection|failed to fetch|networkerror|load failed/i.test(m)) return "No connection — please try again.";
        if (/slot full|all courts taken|every court is booked|just been taken|duplicate key|unique_violation/i.test(m)) return "Those nets have just been taken — please pick another hour.";
        if (/too many pending requests/i.test(m)) return "This number already has requests waiting. The academy will call you.";
        if (/desk is catching up/i.test(m)) return "The desk is catching up on today's requests. Please try again later.";
        if (/too many requests/i.test(m)) return "We already have an enquiry from this number today.";
        if (/valid phone required/i.test(m)) return "Please enter a 10-digit mobile number.";
        if (/name required/i.test(m)) return "Please enter your name.";
        if (/date too far ahead/i.test(m)) return "Requests open up to 90 days ahead. Please pick an earlier date.";
        if (/date in the past/i.test(m)) return "That date has passed. Please pick today or later.";
        if (/invalid hour/i.test(m)) return "The nets are bookable between 6 AM and 11 PM.";
        if (/unknown sport|no rate configured|unknown academy/i.test(m)) return "That facility is not open for online requests yet.";
        if (/not authorised|permission denied|jwt/i.test(m)) return "Online requests are closed at the moment.";
        return m;
      }

      /* Coarse reason only — an event never carries a name, number or amount. */
      function classify(m) {
        m = String(m || "");
        if (/no connection|failed to fetch|networkerror|load failed/i.test(m)) return "network";
        if (/slot full|all courts taken|just been taken/i.test(m)) return "slot_full";
        if (/too many pending|too many requests|desk is catching up/i.test(m)) return "rate_limited";
        if (/valid phone required|name required/i.test(m)) return "bad_input";
        if (/date too far ahead|date in the past|invalid hour/i.test(m)) return "bad_slot";
        return "other";
      }

      /* ---------- availability ----------
         Two reads fired together, not one after the other: a round trip is
         ~180 ms to Tokyo and the network is ~97% of it. Slots are required;
         the tenant read is optional and falls back. */
      function loadAvailability() {
        var date = el.date.value;
        if (!date) return;
        var seq = ++reqSeq;
        loadErr = null; slots = null;
        render();

        Promise.all([
          LT_CLOUD.publicSlots(date, date),
          LT_CLOUD.tenantConfig().catch(function () { return null; })
        ]).then(function (out) {
          if (seq !== reqSeq) return;
          var cfg = out[1] && out[1].config;
          if (cfg && cfg.courts) {
            courts.nets   = Number(cfg.courts.nets)   > 0 ? Number(cfg.courts.nets)   : COURTS_FALLBACK.nets;
            courts.ground = Number(cfg.courts.ground) > 0 ? Number(cfg.courts.ground) : COURTS_FALLBACK.ground;
          }
          slots = out[0] || [];
          slotsAt = Date.now();
          render();
        }).catch(function (err) {
          if (seq !== reqSeq) return;
          slots = null; loadErr = err;
          render();
        });
      }

      /* public_slots already excludes cancelled rows, and a pending website
         request still holds the slot. Counting courts is not money. */
      function takenAt(sport, hour) {
        if (!slots) return 0;
        var n = 0;
        for (var i = 0; i < slots.length; i++) if (slots[i].sport === sport && Number(slots[i].hour) === hour) n++;
        return n;
      }
      function groundTaken() {
        if (!slots) return 0;
        var n = 0;
        for (var i = 0; i < slots.length; i++) if (slots[i].sport === GROUND) n++;
        return n;
      }
      function groundOk() {
        if (loadErr) return true;      // could not check; an enquiry is still fine
        if (!slots) return false;      // still checking
        return groundTaken() < courts.ground;
      }

      /* ---------- nets grid ---------- */
      function renderSlots() {
        if (loadErr) {
          /* A failed read says so and shows nothing else. Painting every
             hour as free would be inventing availability. */
          LT.fail(el.grid, loadErr);
          var d = document.createElement("div");
          d.className = "grid-dead";
          d.innerHTML = '<button type="button" class="btn btn-glass btn-sm" id="retryBtn">Try again</button>';
          el.grid.appendChild(d);
          var rb = LT.$("#retryBtn");
          if (rb) rb.addEventListener("click", loadAvailability);
          return;
        }
        if (!slots) { LT.skeleton(el.grid, 4); return; }

        var isToday = el.date.value === LT.today();
        var nowHour = new Date().getHours();
        var html = "", open = 0;

        for (var h = HOUR_FROM; h <= HOUR_TO; h++) {
          var past = isToday && h <= nowHour;
          var left = courts.nets - takenAt(NETS, h);
          var full = left <= 0;
          if (!past && !full) open++;
          var sel = selected.indexOf(h) !== -1;
          var sub = past ? '<span class="faint">Passed</span>'
                  : full ? '<span class="sl-full">Full</span>'
                  : left === 1 ? '<span class="sl-left">Last net free</span>'
                  : LT.esc(left + " nets free");
          html += '<button type="button" class="slot' + (sel ? " sel" : "") + (past || full ? " taken" : "") +
                  '" data-h="' + h + '"' + (past || full ? " disabled" : "") +
                  ' aria-pressed="' + (sel ? "true" : "false") + '">' +
                  '<span class="sl-time">' + LT.esc(LT.hourLabel(h)) + "</span>" +
                  '<span class="sl-rate">' + sub + "</span></button>";
        }
        el.grid.innerHTML = html;

        /* A grid of seventeen greyed tiles is a dead end — offer the next
           date rather than leaving the visitor to find the date picker. */
        if (open === 0) {
          var note = document.createElement("div");
          note.className = "grid-dead";
          note.innerHTML = "<span>" +
            (isToday && nowHour >= HOUR_TO ? "Today's last slot has started." : "Every net is taken.") +
            '</span><button type="button" class="btn btn-glass btn-sm" id="nextDayBtn">Try the next day</button>';
          el.grid.appendChild(note);
          var nd = LT.$("#nextDayBtn");
          if (nd) nd.addEventListener("click", function () {
            var d2 = new Date(el.date.value + "T00:00:00");
            d2.setDate(d2.getDate() + 1);
            el.date.value = LT.isoDate(d2);
            selected = []; say("");
            loadAvailability();
          });
        }
      }

      /* ---------- ground: availability only, never a rate ---------- */
      function renderGround() {
        if (loadErr) {
          el.ground.innerHTML = '<div class="cell-status gold">Could not check this date</div>';
        } else if (!slots) {
          LT.skeleton(el.ground, 1);
        } else if (groundTaken() >= courts.ground) {
          el.ground.innerHTML = '<div class="cell-status red">Taken on ' + LT.esc(longDate(el.date.value)) + "</div>";
        } else {
          el.ground.innerHTML = '<div class="cell-status green">Free on ' + LT.esc(longDate(el.date.value)) + "</div>";
        }
      }

      /* ---------- progressive reveal ----------
         A step appears once the one above it is answered. The date is
         pre-filled with today, so choosing a facility answers step 2 too.

         Step 4 does not disappear again once it is open. It holds the
         name, the number AND the error message, so hiding it when the last
         hour is deselected would throw away typing — and a failed send
         clears the selection, which would take the very message explaining
         the failure off the screen with it. */
      function renderSteps() {
        var nets = facility === NETS;
        var haveDate = !!el.date.value;
        if (haveDate && (nets ? selected.length > 0 : groundOk())) step4Open = true;

        var fresh = [];
        function step(node, on) {
          var was = !node.hidden;
          node.hidden = !on;
          if (on && !was) fresh.push(node);
        }
        step(el.s2, !!facility);
        step(el.s3, nets && haveDate);
        step(el.s4, step4Open);

        el.ground.hidden = nets || !haveDate;
        el.detailsNum.textContent = nets ? "4" : "3";
        el.selCount.hidden = !selected.length;
        el.selCount.textContent = selected.length + plural(selected.length, " hour", " hours");
        syncSubmit();

        /* Re-quote whenever the selection, the date or the facility moves.
           Hooked here rather than in render(), because picking an hour
           calls renderSteps() ALONE — quoting from render() would miss
           exactly the change that alters the price. */
        loadQuote();

        /* Scroll the newest step into view on narrow screens only — on a
           desktop the whole flow is already visible. */
        if (fresh.length && window.innerWidth < 720) {
          var last = fresh[fresh.length - 1];
          setTimeout(function () { last.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80);
        }
      }

      /* Availability + steps. Selecting an hour calls renderSteps() ALONE:
         redrawing the grid would replace the tile just activated, so a
         keyboard user loses focus to <body> after every Enter and a touch
         user sees a flicker. The other tiles' numbers have not changed. */
      function render() {
        if (facility) { if (facility === NETS) renderSlots(); else renderGround(); }
        renderSteps();
      }

      function valid() {
        if (String(el.name.value || "").trim().length < 2) return false;
        if (String(el.phone.value || "").replace(/\D/g, "").length < 10) return false;
        if (!el.date.value) return false;
        return facility === NETS ? selected.length > 0 : groundOk();
      }
      function syncSubmit() {
        /* "Book" on both paths. The old wording ("Send request" / "Send
           enquiry") described the plumbing rather than the intent — the
           customer is booking. The success card still says plainly that
           the academy confirms it, which is where that caveat belongs. */
        el.submit.textContent = sending
          ? "Booking…"
          : (facility === GROUND ? "Book the ground" : "Book");
        el.submit.disabled = sending || !valid();
      }

      /* ---------- the quote ----------
         Every figure comes back from public_quote(). The page holds no
         rate and does no arithmetic: `total` is what the database says the
         selection costs, so the screen and the charge cannot disagree.

         Requests are sequenced by a token — a fast tapper can have two in
         flight, and the slower one must not overwrite the newer answer. */
      var quoteSeq = 0;
      function clearQuote() { quoteSeq++; el.quote.hidden = true; }

      function loadQuote() {
        var host = el.quote;
        if (!host) return;
        if (!facility || !el.date.value) { clearQuote(); return; }
        var wantHours = facility === NETS ? selected.slice() : [];
        if (facility === NETS && !wantHours.length) { clearQuote(); return; }

        var mine = ++quoteSeq;
        el.quoteAmt.textContent = "…";
        el.quoteNote.textContent = "";
        host.hidden = false;

        LT_CLOUD.publicQuote(facility, el.date.value, wantHours).then(function (q) {
          if (mine !== quoteSeq || !q) return;
          el.quoteLab.textContent = q.full_day
            ? "Full day · " + LT.shortDate(el.date.value)
            : wantHours.length + (wantHours.length === 1 ? " hour" : " hours") +
              " × " + LT.fmtINR(q.unit);
          el.quoteAmt.textContent = LT.fmtINR(q.total);
          el.quoteNote.textContent = q.note || "";
        }).catch(function () {
          if (mine !== quoteSeq) return;
          /* A quote that cannot be fetched says so and gets out of the
             way. It must never fall back to a number this page made up —
             that is the one failure that would be worse than silence. */
          clearQuote();
        });
      }

      function setFacility(next) {
        facility = next === GROUND ? GROUND : NETS;
        selected = []; step4Open = false; say("");
        LT.$$(".fac-card", el.facPick).forEach(function (c) {
          var on = c.getAttribute("data-f") === facility;
          c.classList.toggle("active", on);
          c.setAttribute("aria-pressed", on ? "true" : "false");
        });
        loadAvailability();
      }

      /* ---------- submit ----------
         One request_booking per hour. Each is priced, capacity-checked and
         rate-limited by Postgres; nothing here decides anything. Partial
         success is real — hour 7 can land while hour 8 fills — so each
         result is settled and reported individually. */
      function settle(p) {
        return p.then(function (v) { return { ok: true, value: v }; },
                      function (e) { return { ok: false, error: e }; });
      }

      function submitNets(name, phone) {
        var date = el.date.value;
        var hours = selected.slice().sort(function (a, b) { return a - b; });
        return Promise.all(hours.map(function (h) {
          return settle(LT_CLOUD.requestBooking({ sport: NETS, date: date, hour: h, name: name, phone: phone }))
            .then(function (r) { r.hour = h; return r; });
        })).then(function (results) {
          var ok = results.filter(function (r) { return r.ok; });
          var bad = results.filter(function (r) { return !r.ok; });

          if (!ok.length) {
            var first = bad.length ? String(bad[0].error && bad[0].error.message) : "";
            say(readable(first) || "Something went wrong. Please try again.", true);
            LT_CLOUD.track("booking_request_failed", { sport: NETS, reason: classify(first) });
            selected = [];
            loadAvailability();
            return;
          }

          LT_CLOUD.track("booking_requested", { sport: NETS, hours: ok.length });
          el.doneTitle.textContent = "Request received";
          el.doneDetail.innerHTML = "Thanks, <strong>" + LT.esc(name) + "</strong> — " + ok.length +
            plural(ok.length, " hour", " hours") + " at the nets on <strong>" + LT.esc(longDate(date)) + "</strong>.";

          /* Each amount is the figure request_booking RETURNED for that
             hour. Printed one per line and never added up: a total this
             page invented is a number no database agreed to. */
          el.doneLines.innerHTML = ok.map(function (r) {
            var amt = r.value && r.value.amount;
            return '<div class="dl"><span>' + LT.esc(LT.hourLabel(r.hour)) + "</span><b>" +
                   (amt == null ? "—" : LT.esc(LT.fmtINR(amt))) + "</b></div>";
          }).join("");

          el.doneHonest.innerHTML =
            "This is a request, not a confirmed booking — the academy confirms your net and shares payment details." +
            (bad.length ? "<br />" + bad.length + plural(bad.length, " hour was", " hours were") + " not requested: " +
              LT.esc(readable(String(bad[0].error && bad[0].error.message))) : "");
          showDone();
        });
      }

      /* The ground is an enquiry — see the note at the top. The wanted date
         rides in p_trial and the facility is named in p_program, so it is
         unmistakable in the academy's enquiry list. All nine arguments are
         passed: none has a default, and PostgREST omitting one hard-fails. */
      function submitGround(name, phone) {
        var date = el.date.value;
        return LT_CLOUD.submitApplication({
          p_tenant: LT_CLOUD.TENANT, p_name: name, p_phone: phone,
          p_email: null, p_level: null, p_goal: null,
          p_program: "Main ground — full day rental", p_slot: "Full day", p_trial: date
        }).then(function () {
          LT_CLOUD.track("ground_enquiry", { sport: GROUND });
          el.doneTitle.textContent = "Enquiry received";
          el.doneDetail.innerHTML = "Thanks, <strong>" + LT.esc(name) + "</strong> — the main ground on <strong>" +
            LT.esc(longDate(date)) + "</strong>.";
          el.doneLines.innerHTML = "";
          el.doneHonest.textContent = "This is an enquiry, not a booking. The academy will call you to confirm the date and the amount.";
          showDone();
        }).catch(function (err) {
          var m = String((err && err.message) || "");
          say(readable(m) || "Something went wrong. Please try again.", true);
          LT_CLOUD.track("ground_enquiry_failed", { reason: classify(m) });
        });
      }

      function showDone() {
        selected = [];
        el.head.style.display = "none";
        el.steps.style.display = "none";
        el.done.classList.add("show");
        window.scrollTo({ top: 0, behavior: "smooth" });
        LT.toast(facility === GROUND ? "Enquiry sent." : "Request sent.");
      }

      function busy(on) {
        sending = on;
        el.name.disabled = on; el.phone.disabled = on;
        syncSubmit();
      }

      /* ---------- wiring ---------- */
      el.date.value = LT.today();
      el.date.min = LT.today();
      /* 90 days is request_booking's ceiling, computed against the
         database's current_date — the input is a hint, the server decides. */
      var maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 90);
      el.date.max = LT.isoDate(maxDate);

      el.facPick.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".fac-card") : null;
        if (btn) setFacility(btn.getAttribute("data-f"));
      });

      /* Paints THAT tile, then re-runs the steps only — see render(). */
      el.grid.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest(".slot") : null;
        if (!btn || btn.disabled) return;
        say("");
        var h = Number(btn.getAttribute("data-h"));
        var i = selected.indexOf(h);
        var on = i === -1;
        if (on) selected.push(h); else selected.splice(i, 1);
        btn.classList.toggle("sel", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        renderSteps();
      });

      /* EVERY date change re-reads availability, so a slot taken five
         minutes ago cannot still show free. */
      el.date.addEventListener("change", function () {
        selected = []; say("");
        loadAvailability();
      });

      el.refresh.addEventListener("click", loadAvailability);
      el.name.addEventListener("input", syncSubmit);
      el.phone.addEventListener("input", syncSubmit);

      /* A page left open in a pocket goes stale. */
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        if (el.done.classList.contains("show") || !facility) return;
        if (Date.now() - slotsAt > 60000) loadAvailability();
      });

      el.form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (sending) return;

        var name = String(el.name.value || "").trim();
        var digits = String(el.phone.value || "").replace(/\D/g, "");
        var phone = LT.phone10(digits);
        if (name.length < 2) { say("Please enter your name.", true); el.name.focus(); return; }
        if (digits.length < 10 || phone.length !== 10) { say("Please enter a 10-digit mobile number.", true); el.phone.focus(); return; }
        if (facility === NETS && !selected.length) { say("Pick at least one hour first.", true); return; }
        say("");

        busy(true);
        (facility === GROUND ? submitGround(name, phone) : submitNets(name, phone))
          .catch(function (err) {
            /* Nothing above rejects in normal operation — this catches a
               genuine defect rather than losing it to an unhandled
               rejection. */
            say(readable(String((err && err.message) || "")) || "Something went wrong. Please try again.", true);
            LT_CLOUD.report("booking.submit", err);
          })
          .then(function () { busy(false); });
      });

      el.again.addEventListener("click", function () {
        selected = []; step4Open = false;
        el.done.classList.remove("show");
        el.head.style.display = "";
        el.steps.style.display = "";
        el.form.reset();
        say("");
        loadAvailability();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      /* Deep link: booking.html?facility=ground (?sport= honoured too, so a
         link written in the SQL's vocabulary works). Nothing is selected
         otherwise — step 1 is the first question. */
      var m = /[?&](?:facility|sport)=([^&]*)/.exec(location.search);
      var pre = "";
      if (m) { try { pre = decodeURIComponent(m[1]).toLowerCase(); } catch (e) { pre = ""; } }
      if (pre === GROUND || pre === NETS) setFacility(pre); else render();
    })();
  </script>
</body>
</html>
